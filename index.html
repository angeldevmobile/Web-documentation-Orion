<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion Language - One binary, 58 built-in modules</title>
    <meta name="description" content="Orion is a backend and automation language compiled to bytecode in Rust. An HTTP server, dataframes, Excel, crypto, S3 and LLM calls ship in the standard library, not in a package manager." />
    <meta name="author" content="Angel Zapata" />

    <link rel="icon" href="/orion.ico" type="image/x-icon" />
    <script>
      // Aplica el tema (claro/oscuro) antes de pintar para evitar parpadeo.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <meta property="og:title" content="Orion Language - One binary, 58 built-in modules" />
    <meta property="og:description" content="A backend and automation language compiled to bytecode in Rust. HTTP server, dataframes, Excel, crypto, S3 and LLM calls are in the standard library. Try it in the browser playground." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docs-orion.onrender.com/" />
    <meta property="og:site_name" content="Orion Language" />
