<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orion - one language for backend, scripts and data</title>
    <meta name="description" content="Orion is a single executable with 61 built-in modules: an HTTP server, databases, browser automation, dataframes, Excel and PDF, AI. Runs on a Rust VM, with a JIT to native code." />
    <meta name="author" content="Angel Zapata" />

    <link rel="icon" href="/orion.ico" type="image/x-icon" />
    <script>
      // Aplica el tema (claro/oscuro) antes de pintar para evitar parpadeo.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <meta property="og:title" content="Orion - one language for backend, scripts and data" />
    <meta property="og:description" content="A single executable with 61 built-in modules: HTTP server, databases, browser automation, dataframes, Excel, AI. Try it in the browser playground." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docs-orion.onrender.com/" />
    <meta property="og:site_name" content="Orion Language" />

         hace falta un banner 1200x630; al sustituirlo, cambiar twitter:card a
         summary_large_image y actualizar width/height. -->

    <meta property="og:image:width" content="500" />

  </head>
